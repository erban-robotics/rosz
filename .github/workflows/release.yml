# 推 vX.Y.Z tag: 检查, 构建, npm pack 出 tgz, 挂到 GitHub Release. 只用 GitHub 托管 runner (公开仓库下 fork PR 可在自托管 runner 上执行代码)
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: tag 与 package.json 版本一致
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME 与 package.json 版本 $version 不符"; exit 1; }
      # 依赖里的 rosz-wasm 是 Release 上的 tgz, 仓库 .npmrc 已写 allow-remote=all
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack
      - name: 建 Release 并上传 tgz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" erban-robotics-rosz-ui-*.tgz --title "$GITHUB_REF_NAME" --notes-file - <<NOTES
          安装: \`"@erban-robotics/rosz-ui": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/erban-robotics-rosz-ui-${GITHUB_REF_NAME#v}.tgz"\`, 项目 \`.npmrc\` 需 \`allow-remote=all\`; 用法见 README.
          NOTES
