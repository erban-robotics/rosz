# 推送与 PR: 解码金样本回归, WASM 解码测试, rosz-ui 检查 (tsc, eslint, vitest) 与构建, 查看器前端构建. 只用 GitHub 托管 runner (公开仓库不用自托管)
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: cargo test --workspace --exclude rosz-python --exclude rosz-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bindings/wasm/build.sh
      - run: node --test bindings/wasm/test/decode.test.mjs
      - run: npm ci
      - run: npm run check -w @erban-robotics/rosz-ui
      - run: npm run build -w @erban-robotics/rosz-ui
      - run: npm run build -w rosz-view-web
